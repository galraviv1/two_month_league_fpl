name: Build standings

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-standings
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build standings.json
        run: node scripts/build-standings.mjs

      - name: Commit and push if changed
        run: |
          if [[ -n "$(git status --porcelain public/data/standings.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data/standings.json
            git commit -m "chore: rebuild standings"
            git push
          else
            echo "No changes to commit."
          fi
